    <style type='text/css'>
      /* ========== CineStream App CSS ========== */
      :root {
        --netflix-red: #e50914;
        --netflix-red-hover: #f40612;
        --bg-primary: #0a0a0a;
        --bg-secondary: #141414;
        --bg-card: #1a1a1a;

        --text-secondary: #b3b3b3;
        --text-muted: #808080;
        --border: #2a2a2a;
        --shadow-glow: 0 0 30px rgba(229, 9, 20, 0.35);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

      * { margin: 0; padding: 0; box-sizing: border-box; }

      }
      .cs-header.scrolled {
        background: rgba(10,10,10,0.97);

        box-shadow: 0 2px 20px rgba(0,0,0,0.5);
      }
      .cs-logo {
        display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0;
      }
      .cs-logo-icon {
        width: 36px; height: 36px;
        background: linear-gradient(135deg, var(--netflix-red), #b20710);
        border-radius: 6px; display: flex; align-items: center; justify-content: center;
        color: white; font-size: 16px;
      }
      .cs-logo-text {
        font-family: 'Poppins', sans-serif; font-size: 1.6rem; font-weight: 800;
        background: linear-gradient(90deg, #fff, #e50914);

      }
      .cs-nav { display: flex; gap: 6px; list-style: none; }
      .cs-nav button {

      .cs-search-box { position: relative; display: flex; align-items: center; }
      .cs-search-box input {

        color: white; padding: 10px 16px 10px 40px; border-radius: 25px;

      .cs-search-box input:focus { border-color: var(--netflix-red); width: 260px; }

      .cs-hero {
        position: relative; height: 82vh; min-height: 500px; max-height: 820px;
        display: flex; align-items: flex-end; overflow: hidden;

        position: absolute; inset: 0; background-size: cover; background-position: center top;

      .cs-card {

        position: absolute; bottom: 0; left: 0; right: 0;

      .cs-card:hover .cs-card-info { opacity: 1; transform: translateY(0); }
      .cs-card-title {
        font-size: 0.88rem; font-weight: 600; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px;
      }
      .cs-card-meta { font-size: 0.78rem; color: #ffc107; display: flex; align-items: center; gap: 6px; }
      .cs-card-type {
        position: absolute; top: 8px; left: 8px;
        background: rgba(0,0,0,0.75); color: white; font-size: 0.68rem;
        font-weight: 600; padding: 3px 8px; border-radius: 4px; text-transform: uppercase;
      }

      .cs-skeleton {
        background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
        background-size: 200% 100%; animation: cs-shimmer 1.5s infinite;
        border-radius: 10px; aspect-ratio: 2/3;
      }
      @keyframes cs-shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

      .cs-loader-wrap { display: flex; justify-content: center; padding: 40px; grid-column: 1/-1; }
      .cs-loader {
        width: 42px; height: 42px; border: 3px solid rgba(229,9,20,0.2);

      .cs-end-message {
        grid-column: 1/-1; text-align: center; padding: 30px;

      .cs-modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.88);
        backdrop-filter: blur(8px); z-index: 2000;
        display: flex; align-items: center; justify-content: center;

      .cs-modal-banner {

      }
      .cs-modal-banner::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(to top, var(--bg-secondary) 0%, transparent 65%);

      .cs-modal-body { padding: 0 30px 30px; margin-top: -55px; position: relative; z-index: 2; }
      .cs-modal-title { font-family: 'Poppins', sans-serif; font-size: 1.9rem; font-weight: 700; margin-bottom: 10px; }
      .cs-modal-meta {
        display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px;

      }
      .cs-modal-meta .rating { color: #ffc107; font-weight: 600; }
      .cs-genres { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
      .cs-genre-tag {
        background: rgba(229,9,20,0.15); border: 1px solid rgba(229,9,20,0.3);
        color: #ff6b6b; font-size: 0.78rem; padding: 4px 11px; border-radius: 20px;
      }
      .cs-modal-overview { color: var(--text-secondary); line-height: 1.7; margin-bottom: 22px; }
      .cs-modal-actions { display: flex; flex-wrap: wrap; gap: 11px; }

      .cs-footer {
        text-align: center; padding: 35px 4%; border-top: 1px solid var(--border);
        color: var(--text-muted); font-size: 0.88rem;
      }
      .cs-footer a { color: var(--netflix-red); text-decoration: none; }

      .cs-toast {
        position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
        background: #1a1a1a; color: white; padding: 13px 22px; border-radius: 10px;
        border-left: 4px solid var(--netflix-red); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        z-index: 9999; display: flex; align-items: center; gap: 11px; font-size: 0.93rem;
        max-width: 92%;
      }

      @media (max-width: 900px) {
        .cs-nav { display: none; }
        .cs-search-box input { width: 160px; }
        .cs-search-box input:focus { width: 190px; }
        .cs-hero { height: 68vh; }
        .cs-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
      }
      @media (max-width: 600px) {
        .cs-header { padding: 11px 3%; }
        .cs-logo-text { font-size: 1.25rem; }
        .cs-type-toggle { display: none; }
        .cs-hero { height: 62vh; min-height: 420px; }
        .cs-hero-content { padding-bottom: 45px; }
        .cs-grid { grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 10px; }
        .cs-modal-banner { height: 210px; }
        .cs-modal-body { padding: 0 18px 22px; }
        .cs-modal-title { font-size: 1.4rem; }
      }
    </style>
  </head>

    <script type='text/javascript'>
      //<![CDATA[
      const API_KEY = '1a14db98ded75f97a6eba19cf8e7e6cf';
      const BASE = 'https://api.themoviedb.org/3';
      const IMG = 'https://image.tmdb.org/t/p';

      let mediaType = 'movie';
      let currentCategory = 'popular';
      let currentPage = 1;
      let totalPages = 1;
      let isLoading = false;
      let isSearch = false;
      let searchQuery = '';

      const header = document.getElementById('csHeader');
      const heroBg = document.getElementById('csHeroBg');
      const heroContent = document.getElementById('csHeroContent');
      const grid = document.getElementById('csGrid');
      const sectionTitle = document.getElementById('csSectionTitle');
      const pills = document.getElementById('csPills');
      const searchInput = document.getElementById('csSearchInput');
      const modalOverlay = document.getElementById('csModalOverlay');
      const modalBanner = document.getElementById('csModalBanner');
      const modalBody = document.getElementById('csModalBody');
      const modalClose = document.getElementById('csModalClose');

      const categories = {
        movie: [
          { id: 'popular', name: 'Popular', endpoint: '/movie/popular' },
          { id: 'now_playing', name: 'Now Playing', endpoint: '/movie/now_playing' },
          { id: 'top_rated', name: 'Top Rated', endpoint: '/movie/top_rated' },
          { id: 'upcoming', name: 'Upcoming', endpoint: '/movie/upcoming' },
          { id: 'hollywood', name: 'Hollywood', endpoint: '/discover/movie', params: { with_original_language: 'en', sort_by: 'popularity.desc' } }
        ],
        tv: [
          { id: 'popular', name: 'Popular', endpoint: '/tv/popular' },
          { id: 'airing_today', name: 'Airing Today', endpoint: '/tv/airing_today' },
          { id: 'on_the_air', name: 'On The Air', endpoint: '/tv/on_the_air' },
          { id: 'top_rated', name: 'Top Rated', endpoint: '/tv/top_rated' }
        ],
        trending: [
          { id: 'all', name: 'All', endpoint: '/trending/all/week' },
          { id: 'movie', name: 'Movies', endpoint: '/trending/movie/week' },
          { id: 'tv', name: 'TV Shows', endpoint: '/trending/tv/week' }
        ]
      };

      async function api(endpoint, params = {}) {
        try {
          const url = new URL(BASE + endpoint);
          url.searchParams.set('api_key', API_KEY);
          url.searchParams.set('language', 'en-US');
          Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
          const res = await fetch(url);
          if (res.status === 429) {
            showToast('API rate limit reached. Please wait a bit.');
            return null;
          }
          if (!res.ok) throw new Error(res.status);
          return await res.json();
        } catch (e) {
          console.error(e);
          showToast('Failed to fetch data. Check connection.');
          return null;
        }
      }

      function showToast(msg) {
        document.querySelectorAll('.cs-toast').forEach(t => t.remove());
        const t = document.createElement('div');
        t.className = 'cs-toast';
        t.innerHTML = '<i class="fas fa-exclamation-circle"></i><span>' + msg + '</span>';
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
      }

      async function loadHero() {
        const data = await api('/trending/all/week');
        if (!data || !data.results || !data.results.length) {
          heroContent.innerHTML = '<div style="color:#888">Unable to load featured content</div>';
          return;
        }
        const item = data.results[0];
        const title = item.title || item.name;
        const date = item.release_date || item.first_air_date || '';
        const year = date ? date.split('-')[0] : 'N/A';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
        const type = item.media_type === 'tv' ? 'TV Show' : 'Movie';
        const bg = item.backdrop_path ? IMG + '/original' + item.backdrop_path : (item.poster_path ? IMG + '/w1280' + item.poster_path : '');
        heroBg.style.backgroundImage = bg ? "url('" + bg + "')" : '';
        heroContent.innerHTML = '
          <div class="cs-hero-badge"><i class="fas fa-bolt"></i> Trending ' + type + '</div>
          <h1 class="cs-hero-title">' + esc(title) + '</h1>
          <div class="cs-hero-meta">
            <span class="rating"><i class="fas fa-star"></i> ' + rating + '</span>
            <span><i class="far fa-calendar"></i> ' + year + '</span>
            <span><i class="fas fa-tv"></i> ' + type + '</span>
          </div>
          <p class="cs-hero-overview">' + esc(item.overview || 'No description available.') + '</p>
          <div class="cs-hero-btns">
            <button class="cs-btn cs-btn-primary" onclick="csOpenDetails(\'' + (item.media_type || 'movie') + '\', ' + item.id + ')">
              <i class="fas fa-play"></i> Watch Trailer
            </button>
            <button class="cs-btn cs-btn-secondary" onclick="csOpenDetails(\'' + (item.media_type || 'movie') + '\', ' + item.id + ')">
              <i class="fas fa-info-circle"></i> More Info
            </button>
          </div>';
      }

      async function loadContent(reset) {
        if (isLoading) return;
        isLoading = true;

        if (reset) {
          currentPage = 1;
          grid.innerHTML = Array(12).fill('<div class="cs-skeleton"></div>').join('');
        } else {
          const loader = document.createElement('div');
          loader.className = 'cs-loader-wrap';
          loader.id = 'csScrollLoader';
          loader.innerHTML = '<div class="cs-loader"></div>';
          grid.appendChild(loader);
        }

        let data = null;
        if (isSearch && searchQuery) {
          data = await api('/search/multi', { query: searchQuery, page: currentPage, include_adult: false });
        } else {
          const cats = categories[mediaType];
          const cat = cats.find(c => c.id === currentCategory) || cats[0];
          const params = Object.assign({ page: currentPage }, cat.params || {});
          data = await api(cat.endpoint, params);
        }

        const scrollLoader = document.getElementById('csScrollLoader');
        if (scrollLoader) scrollLoader.remove();
        isLoading = false;

        if (!data) {
          if (reset) grid.innerHTML = '<div class="cs-end-message">Failed to load content</div>';
          return;
        }

        totalPages = data.total_pages || 1;
        const results = (data.results || []).filter(function(r) {
          return r.media_type !== 'person' && (r.poster_path || r.profile_path);
        });

        if (reset) grid.innerHTML = '';
        if (results.length === 0 && reset) {
          grid.innerHTML = '<div class="cs-end-message"><i class="fas fa-film" style="font-size:2rem;display:block;margin-bottom:10px;opacity:0.5"></i>No results found</div>';
          return;
        }

        results.forEach(function(item) {
          const title = item.title || item.name || 'Unknown';
          const poster = item.poster_path ? IMG + '/w500' + item.poster_path : 'https://via.placeholder.com/300x450/1a1a1a/555?text=No+Image';
          const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
          const year = (item.release_date || item.first_air_date || '').split('-')[0] || '';
          const type = item.media_type || (item.title ? 'movie' : 'tv');
          const typeLabel = type === 'tv' ? 'TV' : 'Movie';

          const card = document.createElement('div');
          card.className = 'cs-card';
          card.onclick = function() { csOpenDetails(type, item.id); };
          card.innerHTML = '
            <span class="cs-card-type">' + typeLabel + '</span>
            <img src="' + poster + '" alt="' + esc(title) + '" loading="lazy" onerror="this.src=\'https://via.placeholder.com/300x450/1a1a1a/555?text=No+Image\'"/>
            <div class="cs-card-info">
              <div class="cs-card-title">' + esc(title) + '</div>
              <div class="cs-card-meta"><i class="fas fa-star"></i> ' + rating + (year ? ' • ' + year : '') + '</div>
            </div>';
          grid.appendChild(card);
        });

        if (currentPage >= totalPages && !reset) {
          const end = document.createElement('div');
          end.className = 'cs-end-message';
          end.textContent = '— You have reached the end —';
          grid.appendChild(end);
        }
      }

      function renderPills() {
        const cats = categories[mediaType];
        pills.innerHTML = cats.map(function(c) {
          return '<button class="' + (c.id === currentCategory ? 'active' : '') + '" data-id="' + c.id + '">' + c.name + '</button>';
        }).join('');

        pills.querySelectorAll('button').forEach(function(btn) {
          btn.onclick = function() {
            currentCategory = btn.getAttribute('data-id');
            isSearch = false;
            searchInput.value = '';
            updateTitle();
            renderPills();
            loadContent(true);
          };
        });
      }

      function updateTitle() {
        if (isSearch) {
          sectionTitle.innerHTML = '<i class="fas fa-search"></i> <span>Results for "' + esc(searchQuery) + '"</span>';
          return;
        }
        const icons = { movie: 'fa-film', tv: 'fa-tv', trending: 'fa-bolt' };
        const names = { movie: 'Movies', tv: 'TV Shows', trending: 'Trending' };
        const cat = categories[mediaType].find(function(c) { return c.id === currentCategory; });
        sectionTitle.innerHTML = '<i class="fas ' + icons[mediaType] + '"></i> <span>' + (cat ? cat.name : '') + ' ' + names[mediaType] + '</span>';
      }

      function csSwitchType(type) {
        mediaType = type;
        currentCategory = categories[type][0].id;
        isSearch = false;
        searchInput.value = '';
        document.querySelectorAll('.cs-nav-btn').forEach(function(b) {
          b.classList.toggle('active', b.getAttribute('data-type') === type);
        });
        document.querySelectorAll('#csTypeToggle button').forEach(function(b) {
          b.classList.toggle('active', b.getAttribute('data-type') === type);
        });
        renderPills();
        updateTitle();
        loadContent(true);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      async function csOpenDetails(type, id) {
        modalOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
        modalBanner.style.backgroundImage = '';
        modalBody.innerHTML = '<div class="cs-loader-wrap" style="padding:50px"><div class="cs-loader"></div></div>';

        const details = await api('/' + type + '/' + id);
        const videos = await api('/' + type + '/' + id + '/videos');

        if (!details) {
          modalBody.innerHTML = '<div class="cs-end-message">Failed to load details</div>';
          return;
        }

        const title = details.title || details.name;
        const date = details.release_date || details.first_air_date || '';
        const year = date ? date.split('-')[0] : 'N/A';
        const runtime = details.runtime ? Math.floor(details.runtime/60) + 'h ' + (details.runtime%60) + 'm' :
                        (details.episode_run_time && details.episode_run_time[0] ? details.episode_run_time[0] + 'm / ep' : 'N/A');
        const rating = details.vote_average ? details.vote_average.toFixed(1) : 'N/A';
        const genres = (details.genres || []).map(function(g) {
          return '<span class="cs-genre-tag">' + esc(g.name) + '</span>';
        }).join('') || '<span class="cs-genre-tag">Unknown</span>';
        const bg = details.backdrop_path ? IMG + '/original' + details.backdrop_path : (details.poster_path ? IMG + '/w1280' + details.poster_path : '');
        modalBanner.style.backgroundImage = bg ? "url('" + bg + "')" : 'linear-gradient(135deg,#1a1a1a,#0a0a0a)';

        let trailerKey = null;
        if (videos && videos.results) {
          const t = videos.results.find(function(v) { return v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'); }) ||
                    videos.results.find(function(v) { return v.site === 'YouTube'; });
          if (t) trailerKey = t.key;
        }

        modalBody.innerHTML = '
          <h2 class="cs-modal-title">' + esc(title) + '</h2>
          <div class="cs-modal-meta">
            <span class="rating"><i class="fas fa-star"></i> ' + rating + '/10</span>
            <span><i class="far fa-calendar-alt"></i> ' + year + '</span>
            <span><i class="far fa-clock"></i> ' + runtime + '</span>
            <span><i class="fas fa-' + (type === 'tv' ? 'tv' : 'film') + '"></i> ' + (type === 'tv' ? 'TV Show' : 'Movie') + '</span>
          </div>
          <div class="cs-genres">' + genres + '</div>
          <p class="cs-modal-overview">' + esc(details.overview || 'No overview available.') + '</p>
          <div class="cs-modal-actions">
            ' + (trailerKey ?
              '<a href="https://www.youtube.com/watch?v=' + trailerKey + '" target="_blank" class="cs-btn cs-btn-primary"><i class="fas fa-play"></i> Watch Trailer</a>' :
              '<button class="cs-btn cs-btn-primary" disabled style="opacity:0.55;cursor:not-allowed"><i class="fas fa-play"></i> Trailer Unavailable</button>') + '
            <button class="cs-btn cs-btn-secondary" onclick="csCloseModal()"><i class="fas fa-times"></i> Close</button>
          </div>';
      }

      function csCloseModal() {
        modalOverlay.classList.remove('active');
        document.body.style.overflow = '';
      }

      function esc(str) {
        if (!str) return '';
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      // Events
      window.addEventListener('scroll', function() {
        header.classList.toggle('scrolled', window.scrollY > 40);
        if (isLoading || currentPage >= totalPages) return;
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 600) {
          currentPage++;
          loadContent(false);
        }
      });

      document.querySelectorAll('.cs-nav-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          csSwitchType(btn.getAttribute('data-type'));
        });
      });
      document.querySelectorAll('#csTypeToggle button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          csSwitchType(btn.getAttribute('data-type'));
        });
      });

      let searchTimer;
      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        const q = searchInput.value.trim();
        if (q.length === 0) {
          isSearch = false;
          updateTitle();
          renderPills();
          loadContent(true);
          return;
        }
        if (q.length < 2) return;
        searchTimer = setTimeout(function() {
          isSearch = true;
          searchQuery = q;
          currentPage = 1;
          updateTitle();
          pills.innerHTML = '';
          loadContent(true);
        }, 450);
      });

      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          clearTimeout(searchTimer);
          const q = searchInput.value.trim();
          if (q.length >= 2) {
            isSearch = true;
            searchQuery = q;
            currentPage = 1;
            updateTitle();
            pills.innerHTML = '';
            loadContent(true);
          }
        }
      });

      modalClose.onclick = csCloseModal;
      modalOverlay.onclick = function(e) {
        if (e.target === modalOverlay) csCloseModal();
      };
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') csCloseModal();
      });

      // Init
      document.addEventListener('DOMContentLoaded', function() {
        renderPills();
        updateTitle();
        loadHero();
        loadContent(true);
      });
      //]]>
    </script>
  </body>
</html>
